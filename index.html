<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Client Preview Portal</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0B0D11;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      background: #131720;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin: 0 0 10px; }
    p { margin: 0; color: #94A3B8; font-size: 0.95rem; line-height: 1.55; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Client Preview Portal</h1>
    <p>Please open your direct preview link to view your custom website demo.</p>
  </div>
</body>
</html>
